# Tags a release from the module manifest, and drafts the GitHub release from the changelog.
#
# Releasing was a manual step nobody had taken: the repository reached 1.3.0 with no tags at all,
# so nothing in the changelog pointed at anything installable. This closes that without adding a
# ceremony to remember - bump ModuleVersion, merge, and the tag and a draft release appear.
#
# It runs AFTER CI, and only on a run that passed, because a tag is the one thing here that is
# awkward to take back. It is idempotent: if the manifest's version is already tagged it does
# nothing, so an ordinary commit to main that changes no version is a no-op rather than an error.
# That idempotence is also what tags the version main is already carrying, on the first run.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A tag on a commit whose tests failed is worse than a late release.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The commit CI actually passed on, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags are how this decides whether there is anything to do.
          fetch-depth: 0

      - name: Read the version and the changelog entry
        id: release
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile ./MarkstrataSiteBuilder.psd1).ModuleVersion
          $tag = "v$version"
          Write-Host "Manifest version: $version"

          if (git tag --list $tag) {
              Write-Host "$tag already exists - nothing to release."
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              return
          }

          # The section for THIS version only: from its heading to the next one.
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[" + [regex]::Escape($version) + "\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
              throw "CHANGELOG.md has no '## [$version]' section. Add one before releasing, or the release would ship with an empty body."
          }

          $notes = $match.Groups[1].Value.Trim()
          Write-Host "Found $($notes.Split("`n").Count) line(s) of notes for $version."

          "skip=false"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create the tag
        if: steps.release.outputs.skip == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Draft the release
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        # Draft, not published: the notes are worth a read before anyone is told they exist.
        run: gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
